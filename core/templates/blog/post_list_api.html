<head>
      <meta charset="UTF-8">

</head>
<body>
      <h1>blog posts</h1>
      <h3 id='post-title'></h3>
      <!-- <h1>blog posts</h1>
      {% for post in posts %}
      <dev>
            <li>
                  <ul>
                        <a  href="{% url 'blog:post-detail' pk=post.id %}">

                        <h3>{{ post.id }}</h3>

      </dev>
      {% endfor %}

      {% for num in page_obj.paginator.page_range %}
            {% if page_obj.number == num %}
                  <li class="current"><span>{{ num }}</span></li>
            {% else %}
                  <li><a href="?page={{ num }}">{{ num }}</a></li>
            {% endif %}
      {% endfor %}

      {% if page_obj.has_previous %}
            <li><a href="?page={{ page_obj.previous_page_number }}">last</a></li>
      {% endif %}

      {% if page_obj.has_next %}
            <li><a href="?page={{ page_obj.next_page_number }}">next</a></li>
      {% endif %} -->

      <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
      <script>
             $.get('http://127.0.0.1:8000/blog/api/v1/post/', // urls 
                  function(data,textStatus,jqXHR){ // success callback
                        //   alert('status: '+ textStatus + ', data' + data)
                        // console.log(data)
                        const postTitle = $('#post-title');
                        for (post of data.results){
                              postTitle.append(`<h5><a href='${post.absolute_url}'> ${post.title}</a></h5>`);
                        }
                  }
             )
      </script>
</body>
</html>
