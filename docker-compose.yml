services:
  redis:
    container_name: redis
    image: redis:latest  
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: backend
    volumes:
      - ./core:/app
    ports:
      - "8000:8000"
    command: python3 manage.py runserver 0.0.0.0:8000
    environment:
      - SECRET_KEY=test
      - DEBUG=True
      - ALLOWED_HOSTS=backend,localhost,127.0.0.1
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A core worker --loglevel=INFO
    volumes:
      - ./core:/app
    depends_on:
      - backend
      - redis
  smtp4dev:
    image: rnwood/smtp4dev:v3
    restart: always
    ports:
      # Change the number before : to the port the web interface should be accessible on
      # Add 127.0.0.1: prefix for localhost-only access (recommended for security)
      - '5000:80'
      # Change the number before : to the port the SMTP server should be accessible on
      # Add 127.0.0.1: prefix for localhost-only access (recommended for security)
      - '25:25'
      # Change the number before : to the port the IMAP server should be accessible on
      # Add 127.0.0.1: prefix for localhost-only access (recommended for security)
      - '143:143'
      # Change the number before : to the port the POP3 server should be accessible on
      # Add 127.0.0.1: prefix for localhost-only access (recommended for security)
      - '110:110'
    volumes:
        - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev

    
      # The new Locust service
  locust:
    # image: locustio/locust comment this code for internet problem
    image: docker.arvancloud.ir/locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./core/locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host http://backend:8000
    depends_on:
      - backend

volumes:
  smtp4dev-data:
